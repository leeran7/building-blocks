name: CI

# Job `name:` values are GitHub check contexts. They are required to merge
# into main by the ruleset in .github/rulesets/require-ci-on-main.json.
# Renaming a job without updating and re-applying that ruleset drops the gate.
# feat/level-system is the Level System play-testing branch: its PRs need the
# same gates before they merge there.
on:
  push:
    branches: [main, development, feat/level-system]
  pull_request:
    branches: [main, development, feat/level-system]
  merge_group:

permissions:
  contents: read

jobs:
  test:
    name: Lint, Typecheck, and Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm 9
        uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: false

      - name: Get pnpm store path
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('app/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit (critical)
        # registry.npmjs.org's audit endpoint intermittently times out from
        # GitHub-hosted runners; retry before failing a required check on
        # infra flakiness rather than a real finding.
        run: |
          for attempt in 1 2 3; do
            pnpm audit --audit-level=critical && exit 0
            echo "Audit attempt $attempt failed, retrying in 15s..."
            sleep 15
          done
          exit 1

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Typecheck mobile
        run: pnpm mobile:typecheck

      - name: Build hosted targets (Telegram, Discord)
        run: pnpm mobile:build:hosted

      - name: Build and check the portal ZIPs
        run: |
          for t in crazygames youtube itch; do
            pnpm portal:package "$t"
          done

      - name: Upload the CrazyGames ZIP
        uses: actions/upload-artifact@v4
        with:
          name: doomstack-crazygames
          path: app/mobile/dist-zips/crazygames.zip
          if-no-files-found: error

      - name: Lint
        run: pnpm lint

      - name: Run tests
        run: pnpm vitest run
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tower_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/tower_test
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          INTERNAL_TOKEN: ${{ secrets.INTERNAL_TOKEN }}
          BASE_URL: http://localhost:3000

  season:
    # Level System seasons (app/src/game/levels): re-plays every committed
    # season's 300 levels with the route bot through the real stepMatch and
    # fails if any level is no longer winnable, harder than the one before,
    # or loseable by the slower bot. Split in shards so it stays quick.
    name: Season gate (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1/4, 2/4, 3/4, 4/4]
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm 9
        uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: false

      - name: Get pnpm store path
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('app/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify season 1
        run: pnpm season:verify 1 --shard ${{ matrix.shard }}

  ux:
    # UX checks (app/tests/ux, plan "Doomstack to 8/10"): every app screen and
    # web page at phone, small phone and desktop sizes, measured against
    # tests/ux/baseline.json, plus the core flows. Not in the CI gate below yet:
    # add it to `needs` once it has run clean for a while. No secrets: the
    # tests block all traffic that leaves the runner.
    name: UX checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ux
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ux
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/ux
      # The baseline is measured with paid modes on, so the 18+ pages and the
      # links to them are checked too. The build inlines the public flag, so
      # it is set for the whole job; playwright.ux.config.ts pins both again.
      PAID_DUELS_ENABLED: "true"
      NEXT_PUBLIC_PAID_DUELS_ENABLED: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm 9
        uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: false

      - name: Get pnpm store path
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('app/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Migrate the test database
        run: pnpm db:migrate

      # The build loads firebaseAdmin.ts, which refuses to start without a
      # service account. A key generated here, for a project that doesn't
      # exist, lets it build; it can't reach any real Firebase project, and the
      # UX config blanks it again when the website serves.
      - name: Throwaway Firebase Admin key for the build
        shell: bash
        run: |
          {
            echo "FIREBASE_PROJECT_ID=ux-checks"
            echo "FIREBASE_CLIENT_EMAIL=ux-checks@ux-checks.iam.gserviceaccount.com"
            echo "FIREBASE_PRIVATE_KEY<<UX_KEY_EOF"
            openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 2>/dev/null
            echo "UX_KEY_EOF"
          } >> "$GITHUB_ENV"

      - name: Build the website
        run: pnpm build

      - name: Run the UX checks
        run: pnpm ux

      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-checks
          path: |
            app/test-results/ux
            app/test-results/ux-artifacts
            app/playwright-report/ux
          if-no-files-found: ignore

  orchestrator:
    name: Orchestrator loop
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orchestrator
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: orchestrator/yarn.lock

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Typecheck
        run: yarn typecheck

      - name: Test
        run: yarn test

  ci:
    name: CI
    if: always()
    needs: [test, season, orchestrator]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs passed
        env:
          TEST_RESULT: ${{ needs.test.result }}
          SEASON_RESULT: ${{ needs.season.result }}
          ORCHESTRATOR_RESULT: ${{ needs.orchestrator.result }}
        run: |
          echo "test=$TEST_RESULT"
          echo "season=$SEASON_RESULT"
          echo "orchestrator=$ORCHESTRATOR_RESULT"
          if [ "$TEST_RESULT" != "success" ] || [ "$SEASON_RESULT" != "success" ] || [ "$ORCHESTRATOR_RESULT" != "success" ]; then
            echo "Required CI jobs did not all succeed."
            exit 1
          fi
