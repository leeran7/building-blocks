name: CI

# Job `name:` values are GitHub check contexts. They are required to merge
# into main by the ruleset in .github/rulesets/require-ci-on-main.json.
# Renaming a job without updating and re-applying that ruleset drops the gate.
on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  merge_group:

permissions:
  contents: read

jobs:
  test:
    name: Lint, Typecheck, and Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm 9
        uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: false

      - name: Get pnpm store path
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('app/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit (critical)
        # registry.npmjs.org's audit endpoint intermittently times out from
        # GitHub-hosted runners; retry before failing a required check on
        # infra flakiness rather than a real finding.
        run: |
          for attempt in 1 2 3; do
            pnpm audit --audit-level=critical && exit 0
            echo "Audit attempt $attempt failed, retrying in 15s..."
            sleep 15
          done
          exit 1

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Run tests
        run: pnpm vitest run
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tower_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/tower_test
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          INTERNAL_TOKEN: ${{ secrets.INTERNAL_TOKEN }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          BASE_URL: http://localhost:3000

  orchestrator:
    name: Orchestrator loop
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orchestrator
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: orchestrator/yarn.lock

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Typecheck
        run: yarn typecheck

      - name: Test
        run: yarn test

  ci:
    name: CI
    if: always()
    needs: [test, orchestrator]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs passed
        env:
          TEST_RESULT: ${{ needs.test.result }}
          ORCHESTRATOR_RESULT: ${{ needs.orchestrator.result }}
        run: |
          echo "test=$TEST_RESULT"
          echo "orchestrator=$ORCHESTRATOR_RESULT"
          if [ "$TEST_RESULT" != "success" ] || [ "$ORCHESTRATOR_RESULT" != "success" ]; then
            echo "Required CI jobs did not all succeed."
            exit 1
          fi
